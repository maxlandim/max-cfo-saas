name: Ping do servidor
on:
  push:
    branches: [ping]
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - shell: bash {0}
        run: |
          S=https://landimadvisory.com.br
          F='https://firestore.googleapis.com/v1/projects/max-cfo-saas/databases/(default)/documents'
          echo "::warning::saude: $(curl -s -m 15 $S/api/saude)"
          echo "::warning::site -> $(curl -s -o /dev/null -m 20 -w '%{http_code}' $S/) · saude $(curl -s -o /dev/null -m 20 -w '%{http_code}' $S/api/saude)"
          echo "::warning::regras: listar workspaces sem login (403 = fechado) -> $(curl -s -o /dev/null -m 20 -w '%{http_code}' "$F/workspaces")"
          echo "::warning::regras: ler assinatura sem login (403 = fechado) -> $(curl -s -o /dev/null -m 20 -w '%{http_code}' "$F/subscriptions/teste")"
          echo "::warning::regras: ler emissor NFS-e sem login (403 = fechado) -> $(curl -s -o /dev/null -m 20 -w '%{http_code}' "$F/nfseEmissor/teste")"
          echo "::warning::regras: gravar perfil sem login (403 = fechado) -> $(curl -s -o /dev/null -m 20 -w '%{http_code}' -X PATCH -H 'Content-Type: application/json' -d '{"fields":{}}' "$F/perfis/teste-ci")"
          echo "::warning::regras: listar convites sem login (403 = fechado) -> $(curl -s -o /dev/null -m 20 -w '%{http_code}' "$F/convites")"
          for B in max-cfo-saas.appspot.com max-cfo-saas.firebasestorage.app; do
            echo "::warning::storage $B listar sem login (403 = fechado, 404 = bucket não existe) -> $(curl -s -o /dev/null -m 20 -w '%{http_code}' "https://firebasestorage.googleapis.com/v0/b/$B/o")"
          done
          echo "::warning::cadastro novo no ar (1 = sim): $(curl -s -m 20 $S/register | grep -c 'Crie sua conta em 1 minuto') · campo CPF no cadastro (0 = saiu): $(curl -s -m 20 $S/register | grep -c '000.000.000-00')"
          echo "::warning::erro do firestore: $(curl -s -m 20 "$F/workspaces" | tr -d '\n' | cut -c1-200)"

name: Ping do servidor
on:
  push:
    branches: [ping]
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash {0}
        run: |
          S=https://landimadvisory.com.br
          for u in $S/ $S/pricing $S/login $S/dashboard?demo=1 $S/api/saude $S/vendor/ocr/tesseract.min.js $S/modules/leitor.js http://200.141.22.185:8000/api/health; do
            echo "::warning::$u -> $(curl -s -o /dev/null -m 20 -w '%{http_code} em %{time_total}s' "$u")"
          done
          echo "::warning::saude: $(curl -s -m 15 $S/api/saude)"
          echo "::warning::ssl expira: $(echo | openssl s_client -servername landimadvisory.com.br -connect landimadvisory.com.br:443 2>/dev/null | openssl x509 -noout -enddate)"

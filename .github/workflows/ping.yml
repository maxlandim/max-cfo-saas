name: Ping do servidor
on:
  push:
    branches: [ping]
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          for u in https://landimadvisory.com.br/api/saude http://200.141.22.185:8000 http://200.141.22.185:8000/api/health http://200.141.22.185 ; do
            r=$(curl -s -o /dev/null -m 15 -w "%{http_code} %{time_total}s" "$u" || echo "falhou"); echo "::warning::$u -> $r"
          done
          curl -s -m 15 https://landimadvisory.com.br/api/saude | while read l; do echo "::warning::saude: $l"; done
          for p in 22 80 443 8000 6001 6002; do timeout 6 bash -c "</dev/tcp/200.141.22.185/$p" 2>/dev/null && echo "::warning::porta $p aberta" || echo "::warning::porta $p fechada"; done

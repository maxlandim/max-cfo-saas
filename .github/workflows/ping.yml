name: Ping do servidor
on:
  push:
    branches: [ping]
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: bash {0}
        run: |
          S=https://landimadvisory.com.br
          for u in $S/ $S/pricing $S/login $S/dashboard?demo=1 $S/api/saude $S/vendor/ocr/tesseract.min.js $S/modules/leitor.js http://200.141.22.185:8000/api/health; do
            echo "::warning::$u -> $(curl -s -o /dev/null -m 20 -w '%{http_code} em %{time_total}s' "$u")"
          done
          echo "::warning::api/nfse (401 = versão nova no ar, 404 = deploy ainda não feito) -> $(curl -s -o /dev/null -m 20 -w '%{http_code}' "$S/api/nfse?wsId=xxxxxxxx")"
          echo "::warning::nfe.js tem o emissor: $(curl -s -m 20 "$S/modules/nfe.js" | grep -c 'nfse.abrirEmissao')"
          echo "::warning::NS: $(dig +short NS landimadvisory.com.br | tr '\n' ' ')"
          echo "::warning::MX: $(dig +short MX landimadvisory.com.br | tr '\n' ' ')"
          echo "::warning::TXT: $(dig +short TXT landimadvisory.com.br | tr '\n' ' ')"
          echo "::warning::rodape com CNPJ: $(curl -s -m 20 $S/termos | grep -c '68.443.320')"
          echo "::warning::saude: $(curl -s -m 15 $S/api/saude)"
          echo "::warning::ssl expira: $(echo | openssl s_client -servername landimadvisory.com.br -connect landimadvisory.com.br:443 2>/dev/null | openssl x509 -noout -enddate)"

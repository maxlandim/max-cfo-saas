name: Teste no site publicado
on:
  push:
    branches: [teste-e2e]
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python tests/e2e_producao.py
        working-directory: tests
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: saida, path: tests/saida }

name: Teste no site publicado
on:
  push:
    branches: [teste-e2e]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      # Se tests/alvo.txt tiver o nome de um branch, testa esse código rodando localmente (antes de publicar)
      - name: Sobe o site do branch alvo
        continue-on-error: true
        run: |
          ALVO=$(cat tests/alvo.txt 2>/dev/null | tr -d '[:space:]')
          if [ -n "$ALVO" ]; then
            git clone -q --depth 1 -b "$ALVO" https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git /tmp/app
            cd /tmp/app && npm ci --no-audit --no-fund && npm run build > /tmp/build.log 2>&1 || (tail -80 /tmp/build.log; cp /tmp/build.log /tmp/build_falhou.log; exit 1)
            (npm start -- -p 3000 > /tmp/start.log 2>&1 &) ; sleep 8
            echo "SITE=http://localhost:3000" >> $GITHUB_ENV
          fi
      - run: python ia_pdf.py 2>&1 | tee saida_log.txt
        working-directory: tests
        continue-on-error: true
      - run: python telas.py 2>&1 | tee -a saida_log.txt
        working-directory: tests
        continue-on-error: true
      - name: Publica o resultado no branch resultado-e2e
        if: always()
        run: |
          set +e
          mkdir -p /tmp/r && echo $GITHUB_RUN_ID > /tmp/r/execucao.txt
          cp -r tests/saida /tmp/r/ 2>/dev/null; cp tests/saida_log.txt /tmp/r/ 2>/dev/null; cp /tmp/build.log /tmp/start.log /tmp/r/ 2>/dev/null
          rm -rf /tmp/pub && mkdir /tmp/pub && cd /tmp/pub && git init -q -b resultado-e2e && cp -r /tmp/r/. . && rm -rf saida/*.pdf.tmp
          git config user.name robo-teste && git config user.email robo@users.noreply.github.com
          git add -A && git commit -qm "resultado $GITHUB_RUN_ID" 2>&1 | tail -3
          OUT=$(git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" resultado-e2e 2>&1); RC=$?
          echo "$OUT" | tail -5 | while read l; do echo "::warning::push: $l"; done
          du -sh /tmp/pub | while read l; do echo "::warning::tamanho: $l"; done
          exit $RC

name: Teste no site publicado
on:
  push:
    branches: [teste-e2e]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      # Se tests/alvo.txt tiver o nome de um branch, testa esse código rodando localmente (antes de publicar)
      - id: alvo
        run: echo "ref=$(cat tests/alvo.txt 2>/dev/null | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        if: steps.alvo.outputs.ref != ''
        with: { ref: '${{ steps.alvo.outputs.ref }}', path: app }
      - name: Sobe o site do branch alvo
        if: steps.alvo.outputs.ref != ''
        continue-on-error: true
        working-directory: app
        run: |
          npm install --no-audit --no-fund > /tmp/npm.log 2>&1 || { tail -5 /tmp/npm.log | while read l; do echo "::warning::npm: $l"; done; exit 1; }
          npm run build > /tmp/build.log 2>&1 || { tail -15 /tmp/build.log | while read l; do echo "::warning::build: $l"; done; exit 1; }
          nohup npm start -- -p 3000 > /tmp/start.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          echo "SITE=http://localhost:3000" >> $GITHUB_ENV
          echo "::warning::site do branch ${{ steps.alvo.outputs.ref }} no ar em localhost:3000"
      - uses: actions/cache@v4
        with: { path: ~/.diag, key: diag-chaves-v1 }
      - run: bash gemini_diag.sh 2>&1 | tee saida_log.txt; python e2e_producao.py 2>&1 | tee -a saida_log.txt
        working-directory: tests
        continue-on-error: true
      - run: python ia_pdf.py 2>&1 | tee -a saida_log.txt
        working-directory: tests
        continue-on-error: true
      - run: python telas.py 2>&1 | tee -a saida_log.txt
        working-directory: tests
        continue-on-error: true
      - name: Publica o resultado no branch resultado-e2e
        if: always()
        run: |
          set +e
          mkdir -p /tmp/r && echo $GITHUB_RUN_ID > /tmp/r/execucao.txt
          cp -r tests/saida /tmp/r/ 2>/dev/null; cp tests/saida_log.txt /tmp/r/ 2>/dev/null; cp /tmp/build.log /tmp/start.log /tmp/r/ 2>/dev/null
          rm -rf /tmp/pub && mkdir /tmp/pub && cd /tmp/pub && git init -q -b resultado-e2e && cp -r /tmp/r/. . && rm -rf saida/*.pdf.tmp
          git config user.name robo-teste && git config user.email robo@users.noreply.github.com
          git add -A && git commit -qm "resultado $GITHUB_RUN_ID" 2>&1 | tail -3
          OUT=$(git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" resultado-e2e 2>&1); RC=$?
          echo "$OUT" | tail -5 | while read l; do echo "::warning::push: $l"; done
          du -sh /tmp/pub | while read l; do echo "::warning::tamanho: $l"; done
          exit $RC
